# Premaccess fork CI gate — keeps the fork's diff vs twentyhq/twenty a small known set.
#
# This is the load-bearing rule of the fork strategy (docs/TWENTY-FORK-PLAN.md
# §4 in ScaleMeNow/meta-dojo). Without this gate, the fork accumulates
# unrelated upstream edits and rebase against twentyhq/twenty's main eventually
# becomes intractable. With it, the rebase tax stays ~0.
#
# Three kinds of allowance, all declared below — there is no advisory tier:
#
#   1. ALLOWED            — an exact upstream path with a cap on added lines.
#                           Every entry must still differ from upstream, or the
#                           gate fails: a stale entry is debt nobody can justify.
#   2. dep_manifest_cap() — dependency manifests in nested workspaces. Dependabot
#                           opens PRs against every manifest upstream ships, and
#                           these files carry no rebase tax (a lockfile conflict is
#                           resolved by regenerating, never by reading a diff).
#   3. extension paths    — packages/premaccess/ and the twenty-front extensions
#                           dir, unrestricted, excluded from the diff entirely.
#
# The SECURITY PATCHES block inside ALLOWED is the narrow case: upstream files
# carrying a fix for a code-scanning alert upstream has not fixed yet. Each entry
# keeps its alert id and is deleted the moment the upstream fix lands — the stale
# check above makes that mandatory rather than optional.

name: premaccess-fork-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0           # need history to diff vs upstream/main

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/twentyhq/twenty.git
          git fetch --no-tags --quiet upstream main

      - name: Enforce extension-only invariant
        run: |
          set -euo pipefail

          BASE="upstream/main"

          # Collect modified files vs upstream/main, excluding our extension paths.
          mapfile -t TOUCHED < <(
            git diff --name-only "$BASE"...HEAD -- \
              ':!packages/premaccess/' \
              ':!packages/twenty-front/src/extensions/premaccess/' \
              ':!.github/workflows/ci-premaccess-*' \
              ':!.github/workflows/ci-upstream-rebase-*' \
            | sort -u
          )

          declare -A ALLOWED=(
            ["packages/twenty-server/src/app.module.ts"]=2
            ["packages/twenty-server/src/engine/api/graphql/graphql-config/graphql-config.service.ts"]=2
            # upstream renamed useCreateAppRouter.tsx to useCreateWorkspaceAppRouter.tsx
            ["packages/twenty-front/src/modules/app/hooks/useCreateWorkspaceAppRouter.tsx"]=2
            ["packages/twenty-front/src/modules/navigation/components/NavigationDrawerOtherSection.tsx"]=8
            ["package.json"]=2
            ["packages/twenty-docker/twenty/Dockerfile"]=10
            # yarn.lock grows with every fork dependency plus upstream drift; it never
            # conflicts in a way that makes a rebase expensive, so the cap only exists to
            # catch a lockfile that has clearly gone off the rails.
            ["yarn.lock"]=120
            # fork-only CodeBuild spec for the BAM-hosted image build, absent upstream
            [".bam-image-build-buildspec.yml"]=40
            # premaccess is a workspace package, so twenty-server declares it as a dep
            ["packages/twenty-server/package.json"]=2
            # --- SECURITY PATCHES (drop when upstream fixes the alert) ---
            # js/insufficient-password-hash: reset token hashing (alert 23)
            ["packages/twenty-server/src/engine/core-modules/auth/services/reset-password.service.ts"]=32
            # js/insufficient-password-hash: legacy HS256 test helper (alert 24)
            ["packages/twenty-server/test/integration/graphql/utils/forge-legacy-hs256-token.util.ts"]=24
            # js/xss-through-dom: href sanitizer behind ContactLink, RoundedLink,
            # LinkifiedText (alerts 25, 26, 27)
            ["packages/twenty-ui/src/utilities/utils/getSafeUrl.ts"]=32
            ["packages/twenty-ui/src/utilities/utils/__tests__/getSafeUrl.test.ts"]=20
            # js/weak-cryptographic-algorithm: SQL result alias digest (alert 30)
            # upstream promoted twenty-orm-v2 to twenty-orm
            ["packages/twenty-server/src/engine/twenty-orm/sql/utils/build-column-result-alias.util.ts"]=6
          )

          # Dependency manifests in nested workspaces. Matched only for paths that
          # have no exact ALLOWED entry, so the tight caps on the root manifests and
          # on packages/twenty-server/package.json still win. "binary" means the file
          # is tracked as binary upstream and has no line count to cap.
          dep_manifest_cap() {
            case "$1" in
              */.yarn/install-state.gz) echo binary ;;
              */yarn.lock)              echo 400 ;;
              */package.json)           echo 6 ;;
              *)                        echo "" ;;
            esac
          }

          violations=0

          for f in "${TOUCHED[@]}"; do
            [ -z "$f" ] && continue

            cap="${ALLOWED[$f]:-}"
            kind="allowed"
            if [ -z "$cap" ]; then
              cap="$(dep_manifest_cap "$f")"
              kind="dep-manifest"
            fi
            if [ -z "$cap" ]; then
              echo "::error file=$f::upstream file modified outside the declared allowances"
              violations=$((violations + 1))
              continue
            fi

            added="$(git diff --numstat "$BASE"...HEAD -- "$f" | awk 'NR==1 {print $1}')"
            added="${added:-0}"

            # numstat prints "-" for a binary file; there is no line count to compare.
            if [ "$added" = "-" ]; then
              if [ "$cap" = "binary" ]; then
                echo "OK: $f (binary, $kind)"
              else
                echo "::error file=$f::is binary but its cap ($cap) expects a line count"
                violations=$((violations + 1))
              fi
              continue
            fi

            if [ "$cap" = "binary" ]; then
              echo "OK: $f (+$added line(s), no line cap, $kind)"
            elif [ "$added" -gt "$cap" ]; then
              echo "::error file=$f::has $added added lines vs upstream (cap: $cap, $kind)"
              violations=$((violations + 1))
            else
              echo "OK: $f (+$added line(s) <= cap $cap, $kind)"
            fi
          done

          # An ALLOWED entry that no longer differs from upstream is debt that can
          # never fail on its own. Fail on it so it gets deleted.
          for key in "${!ALLOWED[@]}"; do
            still_touched=0
            for f in "${TOUCHED[@]}"; do
              if [ "$f" = "$key" ]; then
                still_touched=1
                break
              fi
            done
            if [ "$still_touched" -eq 0 ]; then
              echo "::error::ALLOWED entry '$key' no longer differs from upstream/main — delete it from the gate"
              violations=$((violations + 1))
            fi
          done

          if [ "$violations" -gt 0 ]; then
            echo
            echo "Fork CI gate FAILED: $violations violation(s)."
            echo "An upstream file outside the allowances must move under packages/premaccess/"
            echo "or packages/twenty-front/src/extensions/premaccess/."
            echo "A stale ALLOWED entry must be deleted from this workflow."
            echo "See docs/TWENTY-FORK-PLAN.md §4 (ScaleMeNow/meta-dojo)."
            exit 1
          fi
          echo
          echo "Fork CI gate passed (${#TOUCHED[@]} upstream file(s) touched, all within caps)."
