# Premaccess fork CI gate — enforces "touch ≤ 1 upstream file" on every PR.
#
# This is the load-bearing rule of the fork strategy (docs/TWENTY-FORK-PLAN.md
# §4 in ScaleMeNow/meta-dojo). Without this gate, the fork accumulates
# unrelated upstream edits and rebase against twentyhq/twenty's main eventually
# becomes intractable. With it, the rebase tax stays ~0 because our diff
# vs upstream is always a small known set.
#
# Allowed deltas vs upstream/main:
#   - packages/twenty-server/src/app.module.ts:   ≤ 2 added lines
#   - packages/twenty-front/src/App.tsx:           ≤ 1 added line  (or src/index.tsx)
#   - anything under packages/premaccess/:         unrestricted
#   - anything under packages/twenty-front/src/extensions/premaccess/: unrestricted
#
# The SECURITY PATCHES block below is a second, narrower kind of exception: upstream
# files carrying a fix for a code-scanning alert that upstream has not fixed yet. Each
# entry is meant to be deleted the moment the corresponding upstream fix lands, so keep
# the caps tight and keep the alert id next to the entry.

name: premaccess-fork-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # need history to diff vs upstream/main

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/twentyhq/twenty.git
          git fetch upstream --quiet

      - name: Enforce extension-only invariant
        run: |
          set -euo pipefail
          # Collect modified files vs upstream/main, excluding our extension paths.
          mapfile -t TOUCHED < <(
            git diff --name-only "upstream/main"...HEAD -- \
              ':!packages/premaccess/' \
              ':!packages/twenty-front/src/extensions/premaccess/' \
              ':!.github/workflows/ci-premaccess-*' \
              ':!.github/workflows/ci-upstream-rebase-*' \
            | sort -u
          )

          declare -A ALLOWED=(
            ["packages/twenty-server/src/app.module.ts"]=2
            ["packages/twenty-server/src/engine/api/graphql/graphql-config/graphql-config.service.ts"]=2
            ["packages/twenty-front/src/App.tsx"]=1
            ["packages/twenty-front/src/index.tsx"]=1
            ["packages/twenty-front/src/modules/app/hooks/useCreateAppRouter.tsx"]=2
            ["packages/twenty-front/src/modules/navigation/components/NavigationDrawerOtherSection.tsx"]=8
            ["package.json"]=2
            ["packages/twenty-docker/twenty/Dockerfile"]=10
            ["yarn.lock"]=50
            # --- SECURITY PATCHES (drop when upstream fixes the alert) ---
            # js/insufficient-password-hash: reset token hashing (alert 23)
            ["packages/twenty-server/src/engine/core-modules/auth/services/reset-password.service.ts"]=32
            # js/insufficient-password-hash: legacy HS256 test helper (alert 24)
            ["packages/twenty-server/test/integration/graphql/utils/forge-legacy-hs256-token.util.ts"]=24
            # js/xss-through-dom: href sanitizer behind ContactLink, RoundedLink,
            # LinkifiedText (alerts 25, 26, 27)
            ["packages/twenty-ui/src/utilities/utils/getSafeUrl.ts"]=24
            ["packages/twenty-ui/src/utilities/utils/__tests__/getSafeUrl.test.ts"]=20
            # js/weak-cryptographic-algorithm: SQL result alias digest (alert 30)
            ["packages/twenty-server/src/engine/twenty-orm-v2/sql/utils/build-column-result-alias.util.ts"]=6
          )

          violations=0
          for f in "${TOUCHED[@]}"; do
            [ -z "$f" ] && continue
            cap="${ALLOWED[$f]:-}"
            if [ -z "$cap" ]; then
              echo "::error file=$f::upstream file modified outside the two allowed locations"
              violations=$((violations + 1))
              continue
            fi
            added="$(git diff --numstat "upstream/main"...HEAD -- "$f" | awk '{print $1}')"
            added="${added:-0}"
            if [ "$added" -gt "$cap" ]; then
              echo "::error file=$f::has $added added lines vs upstream (cap: $cap)"
              violations=$((violations + 1))
            else
              echo "OK: $f (+$added line(s) ≤ cap $cap)"
            fi
          done

          if [ "$violations" -gt 0 ]; then
            echo
            echo "Fork CI gate FAILED: $violations violation(s)."
            echo "Move the change under packages/premaccess/ or packages/twenty-front/src/extensions/premaccess/."
            echo "See docs/TWENTY-FORK-PLAN.md §4 (ScaleMeNow/meta-dojo)."
            exit 1
          fi
          echo
          echo "Fork CI gate passed (${#TOUCHED[@]} upstream file(s) touched, all within caps)."
