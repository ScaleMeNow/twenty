name: CI Twenty Apps

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      application:
        description: 'App folder name to test (e.g. "twenty-linear"). Leave empty to test all apps.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  discover:
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/discover-apps.yaml
    with:
      scope: internal-and-public
      changed-only: true
      application: ${{ inputs.application }}

  ci:
    needs: discover
    if: needs.discover.outputs.has_apps == 'true'
    name: ${{ matrix.app.name }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.app.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          cache-dependency-path: ${{ matrix.app.path }}/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        if: matrix.app.hasTypecheck
        run: yarn typecheck

      - name: Unit tests
        if: matrix.app.hasUnit
        run: yarn test:unit

  integration:
    needs: discover
    if: needs.discover.outputs.has_apps == 'true'
    name: ${{ matrix.app.name }} (${{ matrix.server-source }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.matrix) }}
        server-source: [dockerhub-latest, local]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10

      - name: Spawn Twenty server
        id: twenty
        if: matrix.app.hasIntegration
        uses: ./.github/actions/spawn-twenty-server
        with:
          source: ${{ matrix.server-source }}

      # dockerhub-latest runs the apps against the newest published Twenty
      # release, which is ahead of this fork between weekly upstream rebases: a
      # release that closes an API an app's tests use has no fix on this side
      # until the rebase brings upstream's own adaptation in. That arm therefore
      # reports drift (packages/premaccess/UPSTREAM-IMAGE-DRIFT.md) instead of
      # gating; local, built from these files, stays blocking.
      - name: Test app against server
        id: test-app
        if: matrix.app.hasIntegration
        continue-on-error: ${{ matrix.server-source == 'dockerhub-latest' }}
        uses: ./.github/actions/test-twenty-app
        with:
          api-url: ${{ steps.twenty.outputs.server-url }}
          api-key: ${{ steps.twenty.outputs.api-key }}
          app-path: ${{ matrix.app.path }}
          mode: ${{ matrix.server-source == 'local' && 'installation-and-integration-test' || 'integration-test-only' }}

      # Only reached when the step above failed and was tolerated, so it doubles
      # as the assertion that no arm but dockerhub-latest ever is.
      - name: Report tolerated failure
        if: steps.test-app.outcome == 'failure'
        env:
          APP_NAME: ${{ matrix.app.name }}
          SERVER_SOURCE: ${{ matrix.server-source }}
        run: |
          if [ "$SERVER_SOURCE" != 'dockerhub-latest' ]; then
            echo "::error::$APP_NAME failed against the $SERVER_SOURCE server, which gates merges"
            exit 1
          fi
          echo "::warning title=Published-image drift::$APP_NAME fails against twentycrm/twenty-app-dev:latest while the local arm passes"
          echo "### Published-image drift: \`$APP_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Advisory arm: declare it in \`packages/premaccess/UPSTREAM-IMAGE-DRIFT.md\` or fix it." >> "$GITHUB_STEP_SUMMARY"

  ci-twenty-apps-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [discover, ci, integration]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
